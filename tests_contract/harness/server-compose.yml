# Local disposable smoke only. Invoke via run.py server.
services:
  mongo:
    image: ${H2_MONGO_IMAGE:?set by run.py}
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 2)"]
      interval: 2s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - data:/data/db
  nightscout:
    image: ${H2_NIGHTSCOUT_IMAGE:?set by run.py}
    environment:
      NODE_ENV: production
      TZ: Etc/UTC
      INSECURE_USE_HTTP: 'true'
      MONGO_CONNECTION: mongodb://mongo:27017/nightscout
      API_SECRET: ${H2_NIGHTSCOUT_SECRET:?set by run.py}
      AUTH_DEFAULT_ROLES: readable
      DISPLAY_UNITS: mg/dL
    ports:
      - target: 1337
        host_ip: 127.0.0.1
        protocol: tcp
volumes:
  data:
