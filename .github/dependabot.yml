# Track workflow actions and the dependencies installed by the Python test jobs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directories:
      - /tests
      - /tests_ha
    schedule:
      interval: weekly
      day: monday
    groups:
      python-test-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
