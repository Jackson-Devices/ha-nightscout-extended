name: Parity

# Validate is the sole scheduled and PR entry point and waits for preflight.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  stock:
    name: stock (${{ matrix.site }})
    if: >-
      ${{
        startsWith(github.workflow_ref, format('{0}/.github/workflows/validate.yml@', github.repository))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        site: [mgdl-default, mgdl-custom, mmol-custom]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The adapter prefers the current product when it supports v3. This
      # sparse reference gives legacy-only product branches the same comparator.
      - name: Check out the v3 integration reference
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Jackson-Devices/ha-nightscout-extended
          ref: 44f4e7c2809ee00d43a9642e875efd8fb2157478
          path: .parity-reference
          sparse-checkout: custom_components/nightscout_extended
          persist-credentials: false
      - name: Check out the alarm product revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Jackson-Devices/ha-nightscout-extended
          ref: 941854a09fb399ec8074ea868a885a49c1333b0c
          path: .parity-alarm-product
          sparse-checkout: custom_components/nightscout_extended
          persist-credentials: false
      - name: Stage the corrected-product tests
        shell: bash
        run: |
          test "$(git -C .parity-alarm-product rev-parse HEAD)" = "941854a09fb399ec8074ea868a885a49c1333b0c"
          cp -R tests_parity .parity-alarm-product/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          prune-cache: true

      - name: Prepare parity dependencies
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/parity-venv"
          uv pip install --python "$RUNNER_TEMP/parity-venv/bin/python" \
            -r tests_ha/requirements.txt -r tests_parity/requirements.txt

      - name: Start stock Nightscout (${{ matrix.site }})
        id: stock_start
        run: tests_parity/stock.sh start "${{ matrix.site }}"

      - name: Legacy and candidate API parity
        run: >-
          "$RUNNER_TEMP/parity-venv/bin/python" -m pytest
          tests_parity --ignore=tests_parity/test_stock_contract.py -m "not corrected_product"
          -c tests_parity/pytest.ini -p no:cacheprovider --show-capture=no --tb=short -v

      - name: Start a clean site for the corrected product
        id: corrected_site
        if: ${{ !cancelled() && steps.stock_start.outcome == 'success' }}
        run: tests_parity/stock.sh start "${{ matrix.site }}"

      - name: Alarm and card parity
        if: ${{ !cancelled() && steps.corrected_site.outcome == 'success' }}
        working-directory: .parity-alarm-product
        run: >-
          "$RUNNER_TEMP/parity-venv/bin/python" -m pytest
          tests_parity --ignore=tests_parity/test_stock_contract.py
          -m corrected_product -c tests_parity/pytest.ini -p no:cacheprovider --show-capture=no --tb=short -v

      - name: Stop stock Nightscout
        if: ${{ always() && steps.stock_start.outcome != 'skipped' && steps.stock_start.outcome != '' }}
        run: tests_parity/stock.sh stop
