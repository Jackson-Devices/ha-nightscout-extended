name: CodeQL (advanced opt-in)

on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/workflow-lint.yml

  scan:
    # Off while GitHub-managed default setup is on; see docs/code-scanning.md.
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && vars.CODEQL_ADVANCED_ENABLED == 'true' }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-scan.yml
